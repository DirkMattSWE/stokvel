spring.application.name=backend

# File-backed, not in-memory: a restart mid-demo must not reset the clock (Rule 8).
# foreign_keys=on because SQLite does not enforce foreign keys unless asked, per connection.
#
# date_class=text is not cosmetic. SQLite has no date type, so the driver's default
# is to store a DATE as epoch millis — computed at LOCAL midnight. A current_date of
# 2026-01-15 written in SAST is 2026-01-14T22:00Z, and reading it back on a machine
# running UTC yields the 14th. The clock would silently shift by a day depending on
# where the app runs. Stored as ISO text there is no timezone in the picture at all,
# and ISO strings still compare correctly with <= for the due-date queries.
spring.datasource.url=jdbc:sqlite:stokvel.db?foreign_keys=on&date_class=text
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite locks the whole file to write. One connection removes any chance of
# SQLITE_BUSY: there is one user, one browser, and no concurrency to win back.
spring.datasource.hikari.maximum-pool-size=1

# SQLite is not one of Hibernate's built-in dialects; this one ships in
# hibernate-community-dialects.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# schema.sql is the source of truth for DDL, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Lazy loading stops at the service boundary; DTOs cross the wire, so there is
# nothing left to lazy-load by the time a response is being written.
spring.jpa.open-in-view=false
