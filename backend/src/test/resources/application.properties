# The suite runs against SQLite in memory: same driver, same community dialect, same
# hand-written schema.sql as production — but nothing on disk, so a test run can never
# inherit state from a demo run, and a demo can never inherit state from a test run.
#
# date_class=text is carried over deliberately. It is the setting that stops a DATE
# being stored as epoch millis computed at local midnight, and the clock is the one
# value the whole design protects — testing under different storage than production
# would test the wrong thing.
spring.datasource.url=jdbc:sqlite:file:stokvel-test?mode=memory&cache=shared&foreign_keys=on&date_class=text
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Hibernate never touches the schema, in tests either. @DataJpaTest would otherwise
# default this to create-drop, which against the community SQLite dialect is exactly
# the unreliable auto-DDL that schema.sql exists to avoid.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
